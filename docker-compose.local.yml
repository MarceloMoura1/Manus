services:
  megadesk-local-mysql:
    image: mysql:8.0
    container_name: megadesk-local-mysql
    restart: unless-stopped
    privileged: false
    ports:
      - "127.0.0.1:${LOCAL_MYSQL_PORT:?LOCAL_MYSQL_PORT is required}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?LOCAL_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:?LOCAL_MYSQL_DATABASE is required}
      MYSQL_USER: ${LOCAL_MYSQL_USER:?LOCAL_MYSQL_USER is required}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?LOCAL_MYSQL_PASSWORD is required}
    volumes:
      - megadesk_local_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  megadesk_local_mysql_data:
    name: megadesk_local_mysql_data
