name: Pull request checks

on:
  pull_request:
    branches:
      - release/updater-v2-bootstrap

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_DATABASE_INTEGRATION: "0"
      RUN_ATTACHMENT_DELETE_MYSQL_INTEGRATION: "0"
      RUN_CRM_LIFECYCLE_AUDIT: "0"
      RUN_CRM_NULL_AUDIT: "0"
      RUN_EVOLUTION_E2E: "0"
      RUN_PRODUCT_MEDIA_MYSQL: "0"
      MEGADESK_WRITE_FREEZE_MYSQL_PHYSICAL: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Validate migration files
        run: pnpm db:validate

      - name: Run safe unit and contract tests without external services
        # This broad directed suite avoids physical-process gates and one stale
        # source-shape assertion already failing on the target SHA.
        run: >-
          pnpm vitest run
          client/src
          server/modules/erp
          server/test-integration-gates.test.ts
          server/canonical-migrations.test.ts
          scripts/operations/assemble-runtime-release.test.mjs
          scripts/operations/package-runtime-release.test.mjs
          scripts/operations/linux-arm64-release-deploy.test.mjs
          --exclude server/modules/erp/reports/structure.test.ts

      - name: Build application
        run: pnpm run build

  linux-arm64-deploy-tooling:
    name: Linux ARM64 deployment-tooling contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: "true"
      CANDIDATE_RUN_ID: "38927166246"
      CANDIDATE_ARTIFACT: megadesk-arm64-candidate-38927166246
      CANDIDATE_COMMIT: eb6d1b0221854f87f8878afe44323ab0c7815699
      CANDIDATE_TREE: 6b31e4a3724cb699a7cad44a2ee05094d50608fc
      CANDIDATE_TAR_SHA256: 39e7db9495a9a642d3b76fd76992901385cbfd42b421b8e10b2e2dafcdddf51a
      CANDIDATE_MANIFEST_SHA256: a8338d85254ba92da5f8f646e30f158f663ecd8113ef2f6356a9e01d9ae8dc8b

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Prove Linux ARM64 and GNU tar
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          tar --version | grep -F 'GNU tar'

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test isolated staging, activation, and code rollback
        run: pnpm vitest run scripts/operations/linux-arm64-release-deploy.test.mjs --pool=forks --poolOptions.forks.singleFork=true

      # The artifact is immutable CI evidence for this review only. It is not
      # rebuilt, promoted, or used as a deployment source by this job.
      - name: Download immutable ARM64 candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ runner.temp }}/megadesk-arm64-candidate
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify immutable ARM64 candidate without extraction
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$RUNNER_TEMP/megadesk-arm64-candidate"
          TAR="$(find "$PACKAGE_ROOT" -type f -name "megadesk-runtime-${CANDIDATE_COMMIT}-linux-arm64.tar.gz" -print -quit)"
          MANIFEST="$(find "$PACKAGE_ROOT" -type f -name "megadesk-runtime-${CANDIDATE_COMMIT}-linux-arm64.manifest.json" -print -quit)"
          test -n "$TAR"
          test -n "$MANIFEST"
          pnpm release:linux-arm64-deploy -- verify \
            --tar "$TAR" \
            --manifest "$MANIFEST" \
            --expected-artifact-name "megadesk-runtime-${CANDIDATE_COMMIT}-linux-arm64.tar.gz" \
            --expected-tar-sha256 "$CANDIDATE_TAR_SHA256" \
            --expected-manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --expected-commit "$CANDIDATE_COMMIT" \
            --expected-tree "$CANDIDATE_TREE"
