name: Pull request checks

on:
  pull_request:
    branches:
      - release/updater-v2-bootstrap

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_DATABASE_INTEGRATION: "0"
      RUN_ATTACHMENT_DELETE_MYSQL_INTEGRATION: "0"
      RUN_CRM_LIFECYCLE_AUDIT: "0"
      RUN_CRM_NULL_AUDIT: "0"
      RUN_EVOLUTION_E2E: "0"
      RUN_PRODUCT_MEDIA_MYSQL: "0"
      MEGADESK_WRITE_FREEZE_MYSQL_PHYSICAL: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Validate migration files
        run: pnpm db:validate

      - name: Run safe unit and contract tests without external services
        # This broad directed suite avoids physical-process gates and one stale
        # source-shape assertion already failing on the target SHA.
        run: >-
          pnpm vitest run
          client/src
          server/modules/erp
          server/test-integration-gates.test.ts
          server/canonical-migrations.test.ts
          scripts/operations/assemble-runtime-release.test.mjs
          scripts/operations/package-runtime-release.test.mjs
          scripts/operations/linux-arm64-release-deploy.test.mjs
          --exclude server/modules/erp/reports/structure.test.ts

      - name: Build application
        run: pnpm run build

  linux-arm64-deploy-tooling:
    name: Linux ARM64 deployment-tooling contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Prove Linux ARM64 and GNU tar
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          tar --version | grep -F 'GNU tar'

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test isolated staging, activation, and code rollback
        run: pnpm vitest run scripts/operations/linux-arm64-release-deploy.test.mjs --pool=forks --poolOptions.forks.singleFork=true
