# ============================================================
# Evolution API + MySQL próprio — Docker Compose
# ============================================================
# O MegaDesk continua usando o MySQL LOCAL (megadesk_main).
# A Evolution API usa um banco MySQL SEPARADO dentro do Docker.
# Nenhuma dependência do MySQL local ou da senha root.
# ============================================================
#
# Subir:  docker compose -f docker-compose.evolution.yml up -d
# Parar:  docker compose -f docker-compose.evolution.yml down
# Logs:   docker compose -f docker-compose.evolution.yml logs -f
# ============================================================

services:

  # ── Banco de dados exclusivo da Evolution API ─────────────
  evolution-db:
    image: mysql:8.0
    container_name: megadesk-evolution-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EVOLUTION_MYSQL_ROOT_PASSWORD:?EVOLUTION_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE:      ${EVOLUTION_MYSQL_DATABASE:?EVOLUTION_MYSQL_DATABASE is required}
      MYSQL_USER:          ${EVOLUTION_MYSQL_USER:?EVOLUTION_MYSQL_USER is required}
      MYSQL_PASSWORD:      ${EVOLUTION_MYSQL_PASSWORD:?EVOLUTION_MYSQL_PASSWORD is required}
    volumes:
      - evolution_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Evolution API ─────────────────────────────────────────
  evolution-api:
    # v2.3.7: estável, sem licença, com fix do wavoipToken MySQL
    # Não usar atendai/latest (v2.2.3 tem bug wavoipToken)
    image: evoapicloud/evolution-api:v2.3.7
    container_name: megadesk-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      evolution-db:
        condition: service_healthy

    environment:
      # ── Servidor ────────────────────────────────────────
      SERVER_PORT: "8080"
      SERVER_URL: "http://localhost:8080"
      SERVER_DISABLE_MANAGER: "false"

      # ── Autenticação ────────────────────────────────────
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # ── Banco exclusivo da Evolution (dentro do Docker) ─
      DATABASE_PROVIDER: "mysql"
      DATABASE_CONNECTION_URI: mysql://${EVOLUTION_MYSQL_USER:?EVOLUTION_MYSQL_USER is required}:${EVOLUTION_MYSQL_PASSWORD:?EVOLUTION_MYSQL_PASSWORD is required}@evolution-db:3306/${EVOLUTION_MYSQL_DATABASE:?EVOLUTION_MYSQL_DATABASE is required}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # O MegaDesk é o repositório das conversas. Na Evolution 2.3.7/MySQL,
      # a persistência operacional interrompe MESSAGES_UPSERT com erro Prisma P2010
      # antes da entrega ao webhook; somente a instância precisa permanecer no provider.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_DELETE_MESSAGE: "false"

      # ── Cache local (sem Redis) ─────────────────────────
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: "86400"

      # ── Sessão persistente ──────────────────────────────
      DEL_INSTANCE: "false"

      # ── QR Code ─────────────────────────────────────────
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#25D366"

      # ── Logs ────────────────────────────────────────────
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    # Volume para sessões WhatsApp (mantém conectado após restart)
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_db_data:
    name: megadesk_evolution_db
  evolution_instances:
    name: megadesk_evolution_instances
  evolution_store:
    name: megadesk_evolution_store
