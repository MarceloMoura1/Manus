# ============================================================
# Evolution API + MySQL próprio — Docker Compose
# ============================================================
# O MegaDesk continua usando o MySQL LOCAL (megadesk_main).
# A Evolution API usa um banco MySQL SEPARADO dentro do Docker.
# Nenhuma dependência do MySQL local ou da senha root.
# ============================================================
#
# Subir:  docker compose -f docker-compose.evolution.yml up -d
# Parar:  docker compose -f docker-compose.evolution.yml down
# Logs:   docker compose -f docker-compose.evolution.yml logs -f
# ============================================================

services:

  # ── Banco de dados exclusivo da Evolution API ─────────────
  evolution-db:
    image: mysql:8.0
    container_name: megadesk-evolution-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: EvolutionRoot123
      MYSQL_DATABASE:      evolution_api
      MYSQL_USER:          evolution
      MYSQL_PASSWORD:      Evolution123
    volumes:
      - evolution_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uevolution", "-pEvolution123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Evolution API ─────────────────────────────────────────
  evolution-api:
    # v2.4.0: corrige bug wavoipToken MySQL + schema fixes
    # Imagem movida de atendai/ para evoapicloud/
    image: evoapicloud/evolution-api:2.4.0
    container_name: megadesk-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      evolution-db:
        condition: service_healthy

    environment:
      # ── Servidor ────────────────────────────────────────
      SERVER_PORT: "8080"
      SERVER_URL: "http://localhost:8080"
      SERVER_DISABLE_MANAGER: "false"

      # ── Autenticação ────────────────────────────────────
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: "megadesk-evolution-key"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # ── Banco exclusivo da Evolution (dentro do Docker) ─
      DATABASE_PROVIDER: "mysql"
      DATABASE_CONNECTION_URI: "mysql://evolution:Evolution123@evolution-db:3306/evolution_api"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_DELETE_MESSAGE: "false"

      # ── Cache local (sem Redis) ─────────────────────────
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: "86400"

      # ── Sessão persistente ──────────────────────────────
      DEL_INSTANCE: "false"

      # ── QR Code ─────────────────────────────────────────
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#25D366"

      # ── Logs ────────────────────────────────────────────
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"

    # Volume para sessões WhatsApp (mantém conectado após restart)
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_db_data:
    name: megadesk_evolution_db
  evolution_instances:
    name: megadesk_evolution_instances
  evolution_store:
    name: megadesk_evolution_store
